name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # SpeechAnalyzer and FoundationModels need the macOS 26 SDK.
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: |
          sw_vers
          swift --version
      - name: Type-check the app
        run: |
          mkdir -p .build
          clang -fobjc-arc -target arm64-apple-macos26.0 -c Sources/AudioTapBridge.m -o .build/AudioTapBridge.o
          swiftc -typecheck -swift-version 5 -parse-as-library -target arm64-apple-macos26.0 \
            -import-objc-header Sources/AudioTapBridge.h Sources/*.swift
      - name: Run tests
        run: ./test.sh
